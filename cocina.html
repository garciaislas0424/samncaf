<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pedidos Cocina</title>

<style>

body{
font-family:Arial;
background:#f5f1eb;
padding:20px;
}

h1{
text-align:center;
color:#4e342e;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
border-left:10px solid #6d4c41;
}

.total{
font-size:24px;
font-weight:bold;
margin-top:15px;
}

.estado{
border:none;
padding:12px;
border-radius:15px;
margin-top:15px;
font-weight:bold;
color:white;
cursor:pointer;
width:100%;
font-size:16px;
}

.pendiente{
background:#ff9800;
}

.entregado{
background:#4caf50;
}

</style>
</head>

<body>

<h1>☕ Pedidos Cafetería</h1>

<div class="grid" id="pedidos"></div>

<script>

const scriptURL =
'https://script.google.com/macros/s/AKfycbygSPS7t-7DyEmv3v9-1rlF7A4eNofueXVUuhwYBRx2KLm4weJ8IjPHwvS2dsoecrFQ7g/exec';

async function cargarPedidos(){

const res = await fetch(scriptURL);

const data = await res.json();

const pedidos =
document.getElementById("pedidos");

pedidos.innerHTML = "";

data.reverse().forEach(p=>{

const entregado =
p.estado === "ENTREGADO";

pedidos.innerHTML += `

<div class="card">

<h2>📄 ${p.folio}</h2>

<p><b>👤 Cliente:</b> ${p.cliente}</p>

<p><b>🪑 Mesa:</b> ${p.mesa}</p>

<p><b>☕ Pedido:</b><br>${p.productos}</p>

<p><b>📅 Fecha:</b> ${p.fecha}</p>

<div class="total">
💰 $${p.total}
</div>

<button
class="estado ${entregado ? 'entregado':'pendiente'}"
onclick="cambiarEstado('${p.folio}',this)"
${entregado ? 'disabled' : ''}>

${p.estado}

</button>

</div>

`;

});

}



async function cambiarEstado(folio,btn){

btn.innerText = "ENTREGADO";

btn.classList.remove("pendiente");

btn.classList.add("entregado");

btn.disabled = true;

await fetch(scriptURL,{

method:'POST',

headers:{
'Content-Type':'text/plain;charset=utf-8'
},

body:JSON.stringify({

accion:'entregar',
folio:folio

})

});

}



cargarPedidos();

setInterval(cargarPedidos,5000);

</script>

</body>
</html>
