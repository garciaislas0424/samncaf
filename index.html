const menu = document.getElementById("menu");

let order = [];

Object.keys(menuData).forEach(section=>{

let html = `

<div class="section">

<h2 class="section-title">${section}</h2>

<div class="products">

`;

menuData[section].forEach(item=>{

html += `

<div class="card">

<h3>${item.name}</h3>

<p>${item.desc}</p>

<div class="portion">
${item.portion}
</div>

<div class="price">
$${item.price}
</div>

<label>

<input type="checkbox"
class="select-box"
onchange="toggleProduct('${item.name}',${item.price})">

Agregar

</label>

</div>

`;

});

html += `</div></div>`;

menu.innerHTML += html;

});

function toggleOrder(){

document.getElementById("orderPanel")
.classList.toggle("active");

}

function toggleProduct(name,price){

const exist = order.find(p=>p.name===name);

if(exist){

order = order.filter(p=>p.name!==name);

}else{

order.push({
name,
price,
qty:1
});

}

renderOrder();

}

function renderOrder(){

const list =
document.getElementById("orderList");

list.innerHTML = "";

let total = 0;

order.forEach((item,index)=>{

total += item.price * item.qty;

list.innerHTML += `

<div class="order-item">

<b>${item.name}</b>

<div class="qty-controls">

<button onclick="changeQty(${index},-1)">
-
</button>

<span>${item.qty}</span>

<button onclick="changeQty(${index},1)">
+
</button>

</div>

</div>

`;

});

document.getElementById("total")
.innerHTML = `Total: $${total}`;

}

function changeQty(index,value){

order[index].qty += value;

if(order[index].qty <=0){

order.splice(index,1);

}

renderOrder();

}

function generarFolio(){

const now = new Date();

document.getElementById("folio").innerText =
"CF"+Math.floor(Math.random()*99999);

document.getElementById("fecha").innerText =
now.toLocaleDateString();

document.getElementById("hora").innerText =
now.toLocaleTimeString();

}

generarFolio();

async function guardarPedidoGoogle(){

let total = 0;

order.forEach(item=>{

total += item.price * item.qty;

});

const pedido = {

folio:
document.getElementById("folio").innerText,

fecha:
new Date().toLocaleString(),

mesa:
document.getElementById("mesa").value,

cliente:
document.getElementById("cliente").value,

productos:
order.map(item=>
item.name + ' x' + item.qty).join(', '),

total:total,

estado:'PENDIENTE'

};

await fetch(scriptURL,{

method:'POST',

headers:{
'Content-Type':'text/plain;charset=utf-8'
},

body:JSON.stringify(pedido)

});

}

async function sendOrder(){

if(order.length === 0){

alert("Agrega productos");

return;

}

await guardarPedidoGoogle();

alert("Pedido enviado");

order = [];

renderOrder();

generarFolio();

}
